spring:
  datasource:
    url: jdbc:h2:mem:tasksdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: ${DATASOURCE_USERNAME:admin}
    password: ${DATASOURCE_PASSWORD:secret}
    changeLogFile: db/changelog/db.changelog-master-test.yaml

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master-test.yaml
